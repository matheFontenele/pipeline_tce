name: pipeline-tce

services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?Defina AIRFLOW_DB_NAME no .env}
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Defina AIRFLOW_DB_USER no .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Defina AIRFLOW_DB_PASSWORD no .env}
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  airflow-init:
    image: ${AIRFLOW_RUNTIME_IMAGE:-pipeline-tce-airflow:dev}
    build: &airflow_build
      context: .
      dockerfile: Dockerfile
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE:?Defina AIRFLOW_IMAGE no .env}
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.4}
        PYTHON_VERSION: ${AIRFLOW_PYTHON_VERSION:-3.10}
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_TIMEZONE:-America/Fortaleza}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?Defina AIRFLOW_DB_USER no .env}:${AIRFLOW_DB_PASSWORD:?Defina AIRFLOW_DB_PASSWORD no .env}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?Defina AIRFLOW_DB_NAME no .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Defina AIRFLOW_WEBSERVER_SECRET_KEY no .env}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Defina AIRFLOW_ADMIN_USERNAME no .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Defina AIRFLOW_ADMIN_PASSWORD no .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:?Defina AIRFLOW_ADMIN_EMAIL no .env}
      TCE_CATALOG_DIR: ${TCE_CATALOG_DIR:-/opt/airflow/catalog}
      TCE_PILOT_DATA_DIR: ${TCE_PILOT_DATA_DIR:-/opt/airflow/pilot-data}
      TCE_PILOT_MAX_DISK_USAGE: ${TCE_PILOT_MAX_DISK_USAGE:-0.90}
      TCE_API_MIN_INTERVAL_SECONDS: ${TCE_API_MIN_INTERVAL_SECONDS:-1.5}
      TCE_HTTP_TIMEOUT: ${TCE_HTTP_TIMEOUT:-90}
      TCE_HTTP_MAX_ATTEMPTS: ${TCE_HTTP_MAX_ATTEMPTS:-5}
      TCE_HTTP_400_RETRIES: ${TCE_HTTP_400_RETRIES:-3}
      TCE_HTTP_400_BACKOFF_SECONDS: ${TCE_HTTP_400_BACKOFF_SECONDS:-60}
      TCE_HTTP_429_BACKOFF_SECONDS: ${TCE_HTTP_429_BACKOFF_SECONDS:-30}
      TCE_HTTP_CONNECTION_BACKOFF_SECONDS: ${TCE_HTTP_CONNECTION_BACKOFF_SECONDS:-15}
      TCE_HTTP_MAX_BACKOFF_SECONDS: ${TCE_HTTP_MAX_BACKOFF_SECONDS:-300}
      TCE_HTTP_MAX_RETRY_AFTER_SECONDS: ${TCE_HTTP_MAX_RETRY_AFTER_SECONDS:-900}
      TCE_API_POOL_SLOTS: ${TCE_API_POOL_SLOTS:-1}
      TZ: ${AIRFLOW_TIMEZONE:-America/Fortaleza}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./catalog:/opt/airflow/catalog:ro
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command: /opt/airflow/scripts/airflow-init.sh
    restart: "no"
    security_opt:
      - no-new-privileges:true

  airflow-webserver:
    image: ${AIRFLOW_RUNTIME_IMAGE:-pipeline-tce-airflow:dev}
    build: *airflow_build
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_environment
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./catalog:/opt/airflow/catalog:ro
      - airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_WEBSERVER_BIND:-127.0.0.1}:${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  airflow-scheduler:
    image: ${AIRFLOW_RUNTIME_IMAGE:-pipeline-tce-airflow:dev}
    build: *airflow_build
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_environment
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./catalog:/opt/airflow/catalog:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_pilot_data:/opt/airflow/pilot-data
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  airflow-tests:
    image: pipeline-tce-airflow-test:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE:?Defina AIRFLOW_IMAGE no .env}
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.4}
        PYTHON_VERSION: ${AIRFLOW_PYTHON_VERSION:-3.10}
    profiles: ["test"]
    entrypoint: ["python", "-m", "pytest"]
    command: ["/opt/airflow/tests", "-q"]
    environment:
      PYTHONPATH: /opt/airflow/pipeline-src
    volumes:
      - ./tests:/opt/airflow/tests:ro
      - ./catalog:/opt/airflow/catalog:ro
      - ./dags:/opt/airflow/dags:ro
    security_opt:
      - no-new-privileges:true

volumes:
  airflow_metadata:
  airflow_logs:
  airflow_pilot_data:
